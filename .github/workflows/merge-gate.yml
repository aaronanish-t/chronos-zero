# Merge Gate checks (AGENTS.md section 5) on every push and pull request.
# A contract edited in one place (JSON Schema, Pydantic or TypeScript) without the others fails
# `contracts`; a kernel / Z3 / cartridge regression fails `backend`; a UI type or build error fails `ui`.
name: merge-gate

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/z3-verifier/requirements.txt
      - name: Contract parity (JSON Schema == Pydantic == TypeScript)
        run: python -m pytest tests/test_contract_parity.py -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          pip install -r services/kernel-proxy/requirements.txt
          -r services/z3-verifier/requirements.txt
          -r services/cartridges/requirements.txt
      - name: Persistent PostgreSQL 16 + audit DB
        run: |
          cp deploy/production/.env.example deploy/production/.env
          sed -i \
            -e 's#replace-with-a-long-random-admin-password#ci-admin-password-012345678901234567890#' \
            -e 's#replace-with-a-long-random-application-password#ci-app-password-012345678901234567890#' \
            -e 's#replace-with-a-long-random-api-token-at-least-32-characters#ci-api-token-012345678901234567890123456789#' \
            -e 's#chronos.example.com#chronos.ci.example.com#g' \
            deploy/production/.env
          chmod 600 deploy/production/.env
          docker compose --env-file deploy/production/.env -f deploy/production/docker-compose.yml up -d --wait postgres audit-db
      - name: Seed cartridge databases
        run: >
          docker compose --env-file deploy/production/.env
          -f deploy/production/docker-compose.yml run --rm --no-deps --build agent
          python services/cartridges/seed_databases.py
      - name: Test suite (kernel, Z3, cartridges, live stack with airplane-mode guard)
        run: python -m pytest tests -q --ignore=tests/test_cow_latency.py
      - name: Latency benchmark (report only; hardware-dependent, not a gate on CI runners)
        if: always()
        continue-on-error: true
        run: python -m pytest tests/test_cow_latency.py -s -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/multiverse-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/multiverse-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx next build
