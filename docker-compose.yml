# Local, offline demo stack. PostgreSQL runs entirely in RAM (tmpfs) with durability off:
# every `docker compose up` starts empty and `make seed` rebuilds all cartridge state.
# Never reuse these settings or credentials for a real database.
services:
  postgres:
    image: postgres:16.4-alpine
    container_name: chronos-postgres
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=100
      -c shared_buffers=256MB
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Over TCP: the entrypoint's temporary init server is socket-only, so this passes only
      # once init.sql has run and the real server is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chronos"]
      interval: 1s
      timeout: 2s
      retries: 30
