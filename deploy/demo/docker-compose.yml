# OFFLINE DEMO PROFILE (stage laptop, Wi-Fi off). Not a deployment: production is
# deploy/production/docker-compose.yml. Cartridge Postgres runs in RAM (tmpfs) with durability
# off, so every start is empty and `make demo-seed` rebuilds all state. Ports bind 127.0.0.1 only.
# The credentials are the development defaults that services/runtime_config.py rejects in
# production, so this profile cannot be pointed at by a production install.
name: chronos-demo

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: chronos-demo-postgres
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=100
      -c shared_buffers=256MB
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Over TCP: the entrypoint's temporary init server is socket-only, so this passes only
      # once init.sql has run and the real server is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chronos"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Audit chain server: durable (named volume, default fsync) so the tamper-evident log survives
  # container restarts and `make demo-reset`. Kept separate from cartridge state, which agent SQL can touch.
  audit-db:
    image: postgres:16.4-alpine
    container_name: chronos-demo-audit-db
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chronos-demo-audit-data:/var/lib/postgresql/data
      - ./postgres/audit-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chronos"]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  chronos-demo-audit-data:
